# Releases the committed build in release/ (see SHIPPED in spelldrawer.lua).
# Build it yourself: tools/build_bytecode.py writes release/evade.lua and release/version.txt; commit both and push.
# Auto update reads that pair from this repo's main branch, so the push itself ships it to current installs.
# This checks the pair, sends it to https://kurisumaki.se/umbrella/ for older installs and makes the GitHub release.
# Secrets: FTP_HOST, FTP_USER, FTP_PASS, FTP_DIR (the folder served as https://kurisumaki.se/umbrella/).
name: release
on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:
permissions:
  contents: write # the GitHub release and its tag
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags, for the release's commit list
      # version.txt is "<version> <bytes of evade.lua>", written by the same build: another size means
      # one of the two was committed without the other, and every client would refuse the download
      - name: version
        run: |
          read -r v size < release/version.txt
          [ "$size" = "$(stat -c%s release/evade.lua)" ] || { echo "release/version.txt names $size bytes, evade.lua has $(stat -c%s release/evade.lua): commit both from one build"; exit 1; }
          echo "v$v, $size bytes"
      # shortcut: the FTP server is only for installs of 1.5.0 and older, which update from it; drop this step and its four secrets once those have updated
      # evade.lua first: version.txt must never name a file that isn't there yet
      - name: upload
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          curl --fail --ssl-reqd -T release/evade.lua --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$FTP_DIR/evade.lua"
          curl --fail --ssl-reqd -T release/version.txt --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/$FTP_DIR/version.txt"
      # a GitHub release per version: its CHANGELOG lines (spelldrawer_menu.lua), the commits since the last release, evade.lua attached
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cut -d' ' -f1 release/version.txt)
          gh release view "v$v" >/dev/null 2>&1 && { echo "v$v is already released"; exit 0; }
          # no tag yet (the first release): the commits since the build before this one, not the whole history
          prev=$(git describe --tags --abbrev=0 2>/dev/null || git log -2 --format=%H -- release/evade.lua | sed -n 2p)
          {
            echo "## Changes"
            sed -n "/{ \"$v\", {/,/} },/p" spelldrawer_menu.lua | sed -n 's/^ *"\(.*\)",$/- \1/p'
            echo; echo "## Commits"
            git log --format='- %h %s' ${prev:+$prev..}HEAD
          } > notes.md
          cat notes.md
          gh release create "v$v" release/evade.lua --target "$GITHUB_SHA" --title "v$v" --notes-file notes.md
